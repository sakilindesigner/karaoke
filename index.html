<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17121A">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>音樂劇卡拉OK點歌台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317121A'/%3E%3Ccircle cx='32' cy='22' r='11' fill='%23F2C14E'/%3E%3Cpath d='M27 32h10l-3 22h-4z' fill='%23F2C14E'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #17121A; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #17121A; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .loading i { width: 10px; height: 10px; border-radius: 50%; background: #F2C14E; animation: b 1.2s infinite; }
  .loading i:nth-child(2) { animation-delay: .2s; } .loading i:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="loading" aria-hidden="true"><i></i><i></i><i></i></div>
<script>
  // 點歌系統（Google Apps Script）的網址。放進 iframe 裡就不會出現 Google 的提示橫幅。
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyl45oufrL-JT7OmL1gear0fTkEuKkK8BJrnub3nLzHa8kksIlm4iKqFu9V6mzuVxuu/exec';
  // 這個網址後面的參數（例如 ?host=… 主持人頁、?page=tv 播放畫面）原封不動帶進去
  var f = document.createElement('iframe');
  f.src = APP_URL + location.search;
  f.title = '音樂劇卡拉OK點歌台';
  f.allow = 'autoplay; fullscreen; clipboard-write';
  f.allowFullscreen = true;
  document.body.appendChild(f);
</script>
</body>
</html>
